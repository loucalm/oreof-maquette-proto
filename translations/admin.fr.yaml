admin:
  layout:
    kicker: Administration
    title: Paramétrage de l’offre de formation
    description: >-
      Le métamodèle (types d’élément pédagogique, champs), les squelettes réutilisables et les
      nomenclatures. « Rien n’est figé » : tout se configure ici.
  index:
    title: Administration
    where_title: 'Où se configure quoi ?'
    where_hierarchy: >-
      La <strong>hiérarchie</strong> des niveaux (qui contient qui) est propre à chaque formation :
      « Configuration de la structure » dans son éditeur.
    where_params: >-
      Les <strong>paramètres d’une formation / d’un parcours</strong> (organisation, présentation…) se
      saisissent dans l’éditeur concerné.
    where_common: >-
      Ici on définit ce qui est <strong>commun</strong> : les types, les champs, les squelettes et les
      listes de valeurs.
  validations:
    title: Règles de validation
    heading: Règles de validation
    description: >-
      Ce qui s’ajoute aux champs obligatoires pour colorer les pastilles des onglets : règles
      « obligatoire sous condition » et « au moins un parmi », bornes des champs. Elles se modifient
      dans l’éditeur de chaque type, sous chaque onglet.
    bounds_label: 'Bornes :'
    empty: Aucune règle pour l’instant. Les ajouter depuis l’éditeur d’un type d’élément pédagogique.
  referentiels:
    title: Référentiel
    heading: Référentiel
    description: Les listes de valeurs (select, choix) proposées dans les formulaires.
    libre_title: Libre
    libre_description: >-
      Nomenclatures entièrement éditables, sans équivalent réel dans une autre application : modalités
      d’heure, lieux, régimes d’inscription, niveaux de langue/entrée/sortie…
    entite_title: Lier à des entités
    entite_description: >-
      Listes qui, dans ORéOF, viennent d'entités déjà gérées par leurs propres écrans (domaines, composantes,
      villes, annuaire…) ou d'API externes (ROME, RNCP). Rien à saisir ici : on les modifie dans l'écran indiqué.
      Le prototype n'en garde que des valeurs de démonstration.
    col_list: Liste
    col_managed_by: Gérée dans ORéOF par
    col_values: Démonstration
    values_count: '{0} aucune valeur|{1} 1 valeur|]1,Inf[ %count% valeurs'
    crud:
      domaines: Administration › Domaines
      mentions: Administration › Mentions
      rythmes: Administration › Rythmes de formation
      langues: Administration › Langues
      villes: Administration › Villes
      etablissements: Administration › Établissements
      composantes: Administration › Composantes
      plateformes_admission: Administration › Plateformes d'admission
      types_ue: Administration › Types d'UE
      types_ec: Administration › Types d'EC
      types_epreuve: Administration › Types d'épreuve
      responsables: Gestion des utilisateurs
      codes_rome: API France Travail (ROME)
      competences_rncp: API France compétences (RNCP)
      nature_elp: Administration › Natures d'UE / EC
    new_button: Nouveau référentiel
    delete_confirm: >-
      Supprimer le référentiel « %label% » ? Les valeurs déjà saisies dans les formulaires restent en
      base mais la liste ne sera plus proposée.
    no_value: Aucune valeur.
  fiches_matieres:
    title: Fiches matières hors diplôme
    heading: Fiches matières hors diplôme
    description: >-
      Fiches sans formation porteuse, utilisables par toutes les formations. Leur création et leur
      modification sont réservées à l’administration.
    libelle_field: Libellé de la fiche
    type_field: Type de diplôme (facultatif)
    all_types: Tous
    create: Créer la fiche
    ec_count: '%count% EC'
    empty: Aucune fiche hors diplôme.
