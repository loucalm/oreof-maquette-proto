template:
  index:
    title: Templates de structure
    heading: Templates de structure
    description: >-
      L'arbre imposé d'un diplôme. Rattaché à un diplôme, il est appliqué automatiquement à la création
      d'une formation ; ses éléments pédagogiques verrouillés %lock_icon% figent la structure.
    new_label: Nouveau template
    new_button: Nouveau template
    diplome_badge: 'diplôme : %diplome%'
    multi_parcours: avec parcours
    mono_parcours: sans parcours
    root_count: '%count% ELP racine(s)'
  edit:
    unlock_title: 'ELP figé (ajout/suppression/duplication bloqués) — cliquer pour libérer'
    lock_title: 'Figer cet ELP (ni ajout d’un autre du même type ici, ni suppression, ni duplication côté formation)'
    unlock_move_title: ELP non déplaçable — cliquer pour autoriser le déplacement
    lock_move_title: Empêcher le déplacement de cet ELP côté formation
    label_placeholder: (libellé)
    rename_button: renommer
    move_up: Monter
    move_down: Descendre
    delete_node_confirm: 'Supprimer « %label% » et sa branche du template ?'
    child_label_placeholder: libellé (optionnel)
    add_child_button: enfant
    label_field: Libellé
    diplome_field: Diplôme imposé
    diplome_none: — aucun (template libre) —
    diplome_help: Un seul template par diplôme. Appliqué automatiquement à la création d'une formation.
    multi_parcours_label: Avec parcours
    description_field: Description
    calendar_unit_field: Unité de temps
    calendar_span_field: Durée (nombre d'unités)
    calendar_help: >-
      Valeurs par défaut du diplôme, copiées sur la formation à l'application du template — visibles
      mais non modifiables côté responsable (une dérogation est nécessaire pour les changer).
    structure_table_title: Tableau structurel
    structure_table_help: >-
      La hiérarchie des types de nœud de ce diplôme (« Parcours » toujours en tête, le dernier maillon
      toujours en queue) — contraint les types proposables dans l'arbre ci-dessous.
    mccc_types_title: Types de MCC utilisés
    mccc_types_empty: Aucun type de MCC retenu pour ce diplôme pour l'instant.
    mccc_profile_label: 'Profil :'
    mccc_add_button: Ajouter des types de MCC
    mccc_add_help: >-
      Plusieurs types peuvent coexister pour ce diplôme (ex. CC et CT) — la règle (profil) à appliquer
      se choisit ici, directement.
    mccc_no_profile: Aucune règle définie pour ce type.
    mccc_note: >-
      Les règles elles-mêmes (contenu d'un profil) se créent dans %link_open%Types de MCCC%link_close% ;
      ici on choisit lesquelles s'appliquent à ce diplôme.
    field_overrides_title: 'Champs de %type% pour ce template'
    field_overrides_pencil_title: Champs togglables de cette ligne pour ce template
    field_overrides_empty: Ce type n'a aucun champ togglable pour ce template.
    tree_title: Arbre du template
    tree_empty: Aucun ELP. Ajoutez le premier niveau ci-dessous.
    lock_legend: '%lock_icon% = élément pédagogique figé : le responsable de formation ne pourra ni en ajouter un autre du même type ici, ni le supprimer, ni le dupliquer.'
    add_root_label: 'Ajouter un ELP racine :'
    add_root_button: racine
    delete_confirm: 'Supprimer définitivement le template « %label% » ?'
    delete_button: Supprimer ce template
