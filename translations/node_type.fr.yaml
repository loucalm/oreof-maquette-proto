node_type:
  index:
    title: Types d’éléments pédagogiques
    heading: Type d’éléments pédagogiques
    description: >-
      Créer les ELP / modifier les formulaires. La hiérarchie (qui contient qui) est propre à chaque
      formation ou template, dans « Configuration de la structure ».
    param_title: Formation / Parcours
    elp_title: Éléments pédagogique
    new_button: Nouveau type
    col_label: Libellé
    col_type: Type
    numbering_title: 'Numérotation : %style%'
    reserved_admin_title: Réservée admin
    delete_confirm: >-
      Supprimer le type « %label% » ? Les éléments pédagogiques qui l'utilisent encore empêcheront la
      suppression.
    internal_title: Types internes (non listés ici)
    internal_help: >-
      « Bloc de choix » n'apparaît jamais dans cette liste : ce n'est pas un ELP qu'on choisit, il se
      crée automatiquement quand on clique « Transformer en choix » sur un ELP déjà en place. « Bloc de
      compétences » et « Compétence » (référentiel BCC) ne sont pas non plus des ELP au sens de cette
      page : ils se gèrent depuis l'éditeur BCC de chaque formation, pas depuis un formulaire ici.
  edit:
    new_title: Nouveau type
    breadcrumb_new: nouveau
    new_heading: Nouveau type d’ELP
    edit_heading: 'Modifier « %label% »'
    properties_title: Propriété de l’ELP
    label_field: Libellé
    icon_field: Icône associé
    icon_help: "Nom d'icône %link% (ex. %example%)"
    key_field: Clé
    key_placeholder: auto depuis le libellé
    position_field: Position
    kind_field: Type d'ELP
    kind_help: >-
      Temporel : le nom est calculé (type + numéro, ex. « Année 1 »), aucun libellé n'est demandé côté
      éditeur.
    elp_params_legend: Paramètre de l’ELP
    mutualisable_label: Mutualisable / raccrochable
    choice_transformable_label: Transformable en bloc de choix
    numbering_legend: Numérotation
    numbered_label: Numérotation automatique
    number_style_label: Type de numérotation
    heritee_label: Numérotation héritée
    numbering_help: >-
      Numérotation héritée = préfixée par le numéro du parent (ex. UE 2.1, héritant du Semestre 2).
      Décochée = comptage global continu sur tout l'arbre, sans préfixe (ex. Semestre 1, 2, 3, 4…).
    form_builder_title: Formulaire associé
    form_builder_help: >-
      Onglet › champs et séparateurs, glissables (⠿) pour réordonner. Les champs sont partagés entre
      types (ex. ECTS sur UE et EC).
    form_builder_empty: Aucun champ pour l’instant.
    tab_label: 'Onglet : %tab%'
    add_field_button: Ajouter un champ
    add_field_reuse_help: >-
      Si la clé saisie correspond à un champ existant, il est réutilisé tel quel (le reste du formulaire
      est ignoré) ; sinon un nouveau champ est créé.
    add_separator_button: Ajouter un séparateur
    separator_pill: Séparateur
    separator_label_placeholder: 'ex. Volume horaire'
    remove_field_confirm: >-
      Retirer « %label% » de ce formulaire ? Si aucun autre type ne l'utilise, le champ sera supprimé
      du catalogue.
    not_togglable_title: Ce champ n'est pas togglable par template
    field_type_field: Type de champ
    field_label_field: Libellé
    field_key_field: Clé
    field_key_placeholder: existant ou nouveau
    field_tab_field: Onglet
    field_required_label: Champs requis
    field_help_field: Tooltip / aide
    field_referentiel_field: Référentiel associé
    field_referentiel_none: — Aucun —
    field_referentiel_help: Affiché seulement si le type de champ le permet (choix, radio, case à cocher).
    field_allow_extra_label: 'Autoriser l’ajout de valeur libre (« Autre : ___ »)'
    field_quick_add_label: Autoriser l’ajout au référentiel depuis le formulaire
    field_min_field: Minimum
    field_max_field: Maximum
    field_options_field: 'Options (si pas de référentiel) — une par ligne : <code>valeur|Libellé</code>'
    field_togglable_label: 'Champ togglable (activable/désactivable par diplôme, depuis le tableau structurel du template)'
