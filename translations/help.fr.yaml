formation_check.body: "Liste tout ce qui empêche la maquette d’être complète : sections de paramètres incomplètes, champs requis manquants, MCCC non conformes aux règles du diplôme, écarts d’ECTS aux cibles (30 par semestre, 60 par année…).\n\n« Corriger » ouvre l’éditeur directement sur l’élément concerné."
formation_check.title: Vérifier la saisie
formation_editor.body: "À gauche, la structure de la formation ; à droite, le panneau de l’élément sélectionné.\n\n• Cliquez un élément pour l’ouvrir. Les pastilles indiquent son état (vert complet, orange à compléter, gris vide) ; « À compléter » en haut du panneau mène directement au champ manquant.\n• Rechercher : tapez « / » puis un libellé, une référence (1.2.a) ou un type ; « À compléter » ne montre que ce qui reste à saisir.\n• Réordonner : glisser-déposer, ou les flèches ↑ ↓ du panneau.\n• Les éléments marqués « Verrouillé » ne peuvent être supprimés ni déplacés : demandez une dérogation (drapeau en bas de l’arbre).\n• Chaque modification est archivée : « Annuler » dans la notification ou dans l’en-tête, et l’historique complet est consultable."
formation_editor.title: Éditeur de formation
formation_index.body: "Toutes les formations de l’offre. La barre de remplissage indique la part des champs requis saisis.\n\nL’onglet « Consolidation de l’offre » liste les formations dont seul le squelette est préparé pour l’année suivante : cochez-les et passez-les en construction quand leur structure est prête."
formation_index.title: Offre de formation
formation_quick_grid.body: "Saisissez ECTS et volumes horaires de tous les éléments sur une seule page. Chaque ligne s’enregistre seule une seconde après la frappe (rond bleu : en cours ; vert : enregistré ; rouge : erreur, survolez pour le détail).\n\nClavier : Entrée ou ↓ ligne suivante, ↑ ligne précédente, ← → cellule voisine. Les totaux des semestres et années et leurs écarts aux cibles se mettent à jour en direct.\n\nUne série de saisies ne crée qu’une seule entrée d’historique."
formation_quick_grid.title: Saisie rapide ECTS et heures
formation_view.body: "Consultation en lecture seule de la formation : paramètres, structure, contenu de chaque élément. Cliquez un élément de l’arbre pour afficher son détail."
formation_view.title: Fiche descriptive
parcours_editor.body: "Même éditeur que pour la formation, appliqué au contenu d’un parcours. La position du parcours dans l’arborescence (années de début et de fin, parcours parent) se règle depuis le graphe des parcours de la formation."
parcours_editor.title: Éditeur de parcours
