node_type:
  index:
    title: Types d’éléments pédagogiques
    heading: Type d’éléments pédagogiques
    description: >-
      Créer les ELP / modifier les formulaires. La hiérarchie (qui contient qui) est propre à chaque
      formation, dans « Configuration de la structure ».
    param_title: Formulaires de fiche (formation / parcours)
    library_help: Bibliothèque commune à tous les diplômes. Une variante reprend son formulaire de départ et n'en garde que les écarts ; elle suit les évolutions de son départ.
    col_usage: Diplômes
    usage_title: Nombre de versions de diplôme dont le canevas utilise ce formulaire (ou une de ses variantes)
    variant_badge: variante
    new_variant: Créer une variante
    variant_label_placeholder: Libellé de la variante
    elp_title: Éléments pédagogique
    new_button: Nouveau type
    col_label: Libellé
    col_type: Type
    numbering_title: 'Numérotation : %style%'
    reserved_admin_title: Réservée admin
    delete_confirm: >-
      Supprimer le type « %label% » ? Les éléments pédagogiques qui l'utilisent encore empêcheront la
      suppression.
    readonly_label: lecture seule
    readonly_title: >-
      Cette section (libellé, champs) est encore codée en dur côté formation — la modifier ici n'aurait
      aucun effet visible, donc ce n'est pas modifiable.
    internal_title: Types internes (non listés ici)
    internal_help: >-
      « Bloc de choix » n'apparaît jamais dans cette liste : ce n'est pas un ELP qu'on choisit, il se
      crée automatiquement quand on clique « Transformer en choix » sur un ELP déjà en place. « Bloc de
      compétences » et « Compétence » (référentiel BCC) ne sont pas non plus des ELP au sens de cette
      page : ils se gèrent depuis l'éditeur BCC de chaque formation, pas depuis un formulaire ici.
  edit:
    variant_of: Variante de « %parent% »
    variant_help: Ce formulaire reprend son formulaire de départ ; seuls ses écarts (champs masqués ou ajoutés, libellés, caractère obligatoire, ordre) sont enregistrés ici.
    back_to_canvas: Retour au canevas du diplôme
    usage_title: Utilisé par
    usage_none: Aucun diplôme n'utilise ce formulaire.
    impact_confirm: Je confirme que la modification s'applique aussitôt aux %count% formation(s) concernée(s).
    new_parent_fields: "Nouveaux champs dans le formulaire de départ depuis votre dernière visite :"
    new_parent_fields_ack: Vu
    show_field: Afficher
    hide_field: Masquer
    hidden_badge: masqué
    origin:
      inherited: hérité
      added: ajouté
      hidden: masqué
      label: libellé changé
      help: aide changée
      required: rendu obligatoire
      optional: rendu facultatif
      moved: déplacé
    new_title: Nouveau type
    breadcrumb_new: nouveau
    new_heading: Nouveau type d’ELP
    edit_heading: 'Modifier « %label% »'
    properties_title: Propriété de l’ELP
    label_field: Libellé
    icon_field: Icône associé
    icon_help: "Nom d'icône %link% (ex. %example%)"
    icon_pick: Choisir une icône
    icon_search: Rechercher (en anglais)…
    icon_weight: Graisse de l’icône
    key_field: Clé
    key_placeholder: auto depuis le libellé
    key_auto: générée à l’enregistrement
    key_help: >-
      Identifiant technique, généré depuis le libellé et unique. Il est référencé par les formations
      et les types de diplôme : seul le super-administrateur peut le modifier.
    key_help_superadmin: >-
      Vide = générée depuis le libellé. Attention : changer la clé d’un type déjà utilisé le détache
      des formations qui la référencent.
    position_field: Position
    position_help: >-
      Ordre d’affichage du type dans les listes (administration, menus d’ajout, navigation). Plus petit =
      plus haut. Sans effet sur le contenu des formations.
    kind_field: Type d'ELP
    kind_help: >-
      Temporel : le nom est calculé (type + numéro, ex. « Année 1 »), aucun libellé n'est demandé côté
      éditeur.
    elp_params_legend: Paramètre de l’ELP
    mutualisable_label: Mutualisable / raccrochable
    choice_transformable_label: Transformable en bloc de choix
    element_level_label: Niveau élément (dernier niveau de toute chaîne, comme EC)
    element_level_help: Un seul type de nœud porte ce réglage ; une variante ne le peut pas.
    numbering_legend: Numérotation
    numbered_label: Numérotation automatique
    number_style_label: Type de numérotation
    heritee_label: Numérotation héritée
    numbering_help: >-
      Numérotation héritée = préfixée par le numéro du parent (ex. UE 2.1, héritant du Semestre 2).
      Décochée = comptage global continu sur tout l'arbre, sans préfixe (ex. Semestre 1, 2, 3, 4…).
    form_builder_title: Formulaire associé
    form_builder_help: >-
      Onglet › champs et séparateurs, glissables (⠿) pour réordonner. Les champs sont partagés entre
      types (ex. ECTS sur UE et EC).
    form_builder_empty: Aucun champ pour l’instant.
    tab_label: 'Onglet : %tab%'
    add_field_button: Ajouter un champ
    add_field_reuse_help: >-
      Si la clé saisie correspond à un champ existant, il est réutilisé tel quel (le reste du formulaire
      est ignoré) ; sinon un nouveau champ est créé.
    add_separator_button: Ajouter un séparateur
    separator_pill: Séparateur
    separator_label_placeholder: 'ex. Volume horaire'
    remove_field_confirm: >-
      Retirer « %label% » de ce formulaire ? Si aucun autre type ne l'utilise, le champ sera supprimé
      du catalogue.
    not_togglable_title: Ce champ n'est pas togglable par diplôme
    field_locked_title: >-
      Champ verrouillé : il écrit directement sur une propriété dédiée (pas le blob générique
      d'attributs), sa définition ne peut pas être modifiée ni retirée depuis ce formulaire — seul son
      ordre peut changer.
    field_required_badge: obligatoire
    field_type_field: Type de champ
    field_label_field: Libellé
    field_key_field: Clé
    field_key_placeholder: existant ou nouveau
    field_tab_field: Onglet
    field_required_label: Champs requis
    field_help_field: Tooltip / aide
    field_referentiel_field: Référentiel associé
    field_referentiel_none: — Aucun —
    field_referentiel_help: Affiché seulement si le type de champ le permet (choix, radio, case à cocher).
    field_allow_extra_label: 'Autoriser l’ajout de valeur libre (« Autre : ___ »)'
    field_quick_add_label: Autoriser l’ajout au référentiel depuis le formulaire
    field_min_field: Minimum
    field_max_field: Maximum
    field_min_value: Valeur minimale
    field_max_value: Valeur maximale
    field_min_length: Longueur minimale (caractères)
    field_max_length: Longueur maximale (caractères)
    field_bounds_help_number: Bornes du nombre saisi (ex. ECTS entre 0 et 30). Vide = pas de borne.
    field_bounds_help_text: Nombre de caractères attendus dans la saisie. Vide = pas de limite.
    rules_title: 'Règles de validation de l’onglet (%count%)'
    rules_help: >-
      Elles s’ajoutent aux champs obligatoires : la pastille de l’onglet n’est verte que si elles sont
      respectées, et le message s’affiche sous le champ concerné. Les bornes (min / max) se règlent sur
      chaque champ.
    rule_message_shown: 'Message affiché : « %message% »'
    rule_required_if_title: Obligatoire sous condition
    rule_field: Champ qui devient obligatoire
    rule_when_field: Si le champ
    rule_when_op: Condition
    rule_when_value: Valeur
    rule_when_value_placeholder: 'ex. oui (inutile pour « est rempli »)'
    rule_message: Message (facultatif)
    rule_message_placeholder: 'vide = message généré (ex. « obligatoire si … »)'
    rule_one_of_title: Au moins un parmi
    rule_add_button: Ajouter la règle
    field_min_count: Nombre de choix minimum
    field_max_count: Nombre de choix maximum
    field_bounds_help_count: Nombre de cases à cocher attendues. Vide = pas de limite.
    field_options_field: 'Options (si pas de référentiel) — une par ligne : <code>valeur|Libellé</code>'
    field_togglable_label: 'Champ togglable (activable/désactivable par diplôme, depuis la configuration du type de diplôme)'
