mcctype:
  index:
    title: Types de MCCC
    heading: Types de MCCC
    description: >-
      Les modalités de contrôle des connaissances proposées sur un EC (CCI, CT…) et leurs profils de
      règles de validation (nombre d’épreuves, coefficients…) — le choix du profil pour un diplôme se
      fait au niveau de son template.
    new_button: Nouveau type
    col_type: Type
    col_profiles: Profils
    col_evaluations: Épreuves pondérées
    col_rules: Règles
    delete_confirm: >-
      Supprimer le type de MCCC « %label% » ? Les EC déjà réglés sur ce type conservent leur saisie mais
      ce type ne sera plus proposé.
    footer_note: >-
      Un même type peut porter plusieurs profils de règles (ex. « Licence », « Master ») sans se
      dupliquer — le template de chaque diplôme choisit ensuite lequel s’applique.
  edit:
    new_title: Nouveau type de MCCC
    breadcrumb_new: nouveau
    new_heading: Nouveau type de MCCC
    edit_heading: 'Modifier « %label% »'
    short_label_field: Libellé court (chip)
    label_field: Libellé
    key_field: Clé
    key_placeholder: auto
    description_field: Description (aide admin)
    has_evaluations_label: >-
      Ce type comporte des épreuves à pondérer (nombre d’épreuves + coefficient de chacune)
    evaluations_label_field: Libellé de la collection d’épreuves
    order_field: Ordre
    profiles_title: Profils de règles
    profiles_description: >-
      Un profil nommé (ex. « Licence », « Master ») regroupe les règles à respecter pour un contexte
      donné — le template de chaque diplôme choisit ensuite lequel s’applique.
    profiles_empty: Aucun profil pour ce type — aucune règle n’est appliquée tant qu’aucun n’existe.
    duplicate_profile_button: Dupliquer
    delete_profile_confirm: 'Supprimer le profil « %label% » et toutes ses règles ?'
    profile_label_field: Nom du profil
    profile_description_field: Description (facultatif)
    add_profile_button: Ajouter un profil
    clause_count_label: Nombre d'épreuves
    clause_ponderation_label: Pondération
    clause_ponderation_sum_note: (la somme des coefficients doit faire 100 %)
    clause_ponderation_egale_label: Épreuves égales — plafonner chaque coefficient à
    clause_duree_label: Chaque épreuve a une durée renseignée
    clause_rattrapage_label: Rattrapage / 2nde chance
    clause_rattrapage_help: Informatif pour l'instant — mêmes règles appliquées à la 2nde session, pas de jeu de règles séparé.
